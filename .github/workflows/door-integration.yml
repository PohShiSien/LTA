name: App and backend integration checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, integration/frozen-door-model]
permissions:
  contents: read
concurrency:
  group: door-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        if: ${{ hashFiles('backend/requirements.txt') != '' }}
        with:
          python-version: '3.13'
      - name: Check Door service and shipped frozen model
        if: ${{ hashFiles('backend/requirements.txt') != '' }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pip install -r tests/door/requirements.txt
          python -m pytest tests/door -q
